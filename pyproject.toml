[project]
name = "esp32-clock"
version = "0.1.0"
description = "ESP32 internet clock"
authors = [
    {name = "Chris Diehl", email = "cultclassik@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adafruit-ampy>=1.1.0,<2.0.0",
    "esptool>=5.1.0,<6.0.0",
    "setuptools>=80.9.0,<81.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
# *.sops.py files are sops-encrypted JSON that happens to also be valid
# Python dict-literal syntax -- ruff will "fix" them (e.g. adding a
# trailing comma), which breaks sops's strict JSON parser. Keep ruff out.
extend-exclude = ["*.sops.py"]
